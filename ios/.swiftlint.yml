included:
  - PaperTerritory
  - PaperTerritoryTests

excluded:
  - DerivedData
  - PaperTerritory.xcodeproj
  - build

disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional

force_cast: error
force_try: error
force_unwrapping: error

line_length:
  warning: 120
  error: 120
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 350
  error: 550

identifier_name:
  min_length: 1
  max_length: 50

nesting:
  type_level: 3
