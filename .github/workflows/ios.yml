name: iOS CI

on:
  push:
    branches:
      - main
      - feature-paperio-ios
  pull_request:
    branches:
      - main
      - feature-paperio-ios
  workflow_dispatch:

jobs:
  build-test-lint:
    name: Build, Test & Unsigned IPA (iOS)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift environment
        run: |
          xcodebuild -version
          swift --version
          mkdir -p artifacts

      - name: Install CI tools (XcodeGen, SwiftLint, SwiftFormat)
        run: |
          for tool in xcodegen swiftlint swiftformat; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          xcodegen --version
          swiftlint version
          swiftformat --version

      - name: Generate Xcode project via XcodeGen
        id: gen
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && xcodegen generate) 2>&1 | tee artifacts/xcodegen.log

      - name: Select eligible iOS Simulator
        id: sim
        if: steps.gen.outcome == 'success'
        run: |
          xcodebuild -project ios/PaperTerritory.xcodeproj -scheme PaperTerritory -showdestinations > artifacts/destinations.txt 2>&1
          cat artifacts/destinations.txt
          SIM_UDID=$(python3 -c '
          import re, sys
          txt = open("artifacts/destinations.txt").read()
          matches = []
          for line in txt.splitlines():
              if "platform:iOS Simulator" not in line or "placeholder" in line:
                  continue
              m_id = re.search(r"id:([A-Fa-f0-9-]{36})", line)
              m_os = re.search(r"OS:([0-9.]+)", line)
              m_name = re.search(r"name:([^,}]+)", line)
              if m_id and m_os and m_name:
                  matches.append((m_id.group(1), m_os.group(1), m_name.group(1).strip()))
          iphones = [m for m in matches if "iPhone" in m[2]]
          pool = iphones or matches
          if not pool:
              sys.exit("No eligible iOS Simulator destination found in xcodebuild -showdestinations")
          pool.sort(key=lambda m: (tuple(int(x) for x in m[1].split(".")), m[2]), reverse=True)
          chosen = pool[0]
          print(f"Selected simulator: {chosen[2]} (iOS {chosen[1]}) -> {chosen[0]}", file=sys.stderr)
          print(chosen[0])
          ')
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b || true

      - name: Build & Run Unit Tests (iOS Simulator)
        id: test
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/PaperTerritory.xcodeproj \
            -scheme PaperTerritory \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/DerivedData \
            -resultBundlePath artifacts/TestResults.xcresult \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Build Unsigned Device IPA (Sideloadly / AltStore)
        id: ipa
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/PaperTerritory.xcodeproj \
            -scheme PaperTerritory \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedDataDevice \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild-device.log

          APP_PATH="ios/DerivedDataDevice/Build/Products/Release-iphoneos/PaperTerritory.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p artifacts/ipa_stage/Payload
            cp -R "$APP_PATH" artifacts/ipa_stage/Payload/
            (cd artifacts/ipa_stage && zip -qry ../PaperTerritory-unsigned.ipa Payload)
            rm -rf artifacts/ipa_stage
            ls -lh artifacts/PaperTerritory-unsigned.ipa
          else
            echo "PaperTerritory.app not found at $APP_PATH"
            exit 1
          fi

      - name: Run SwiftLint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && swiftlint lint --strict --config .swiftlint.yml) 2>&1 | tee artifacts/swiftlint.log

      - name: Check SwiftFormat
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && swiftformat --lint --config .swiftformat .) 2>&1 | tee artifacts/swiftformat.log

      - name: Summarize Errors & Emit Annotations
        if: always()
        run: |
          python3 - << 'PY'
          import os, re

          def emit(title, lines):
              print(f"\n=== {title} ===")
              for ln in lines[:15]:
                  clean = ln.replace("%", "%25").replace("\r", "").strip()
                  print(clean)
                  print(f"::error title={title}::{clean[:240]}")

          summary = [
              "## iOS CI Results",
              f"- XcodeGen: {os.environ.get('GEN_OUTCOME')}",
              f"- Simulator Build & Test: {os.environ.get('TEST_OUTCOME')}",
              f"- Unsigned Device IPA: {os.environ.get('IPA_OUTCOME')}",
              f"- SwiftLint: {os.environ.get('LINT_OUTCOME')}",
              f"- SwiftFormat: {os.environ.get('FORMAT_OUTCOME')}",
              ""
          ]

          checks = [
              ("XcodeGen", os.environ.get("GEN_OUTCOME"), "artifacts/xcodegen.log", None),
              ("XcodeTest", os.environ.get("TEST_OUTCOME"), "artifacts/xcodebuild.log", r"(error:|fatal error:|failed|TEST FAILED|Destination)"),
              ("DeviceIPA", os.environ.get("IPA_OUTCOME"), "artifacts/xcodebuild-device.log", r"(error:|fatal error:|failed)"),
              ("SwiftLint", os.environ.get("LINT_OUTCOME"), "artifacts/swiftlint.log", r"(warning:|error:)"),
              ("SwiftFormat", os.environ.get("FORMAT_OUTCOME"), "artifacts/swiftformat.log", r"(\.swift|error:)")
          ]

          for title, outcome, path, pattern in checks:
              if outcome != "success" and os.path.exists(path):
                  all_lines = [l.rstrip() for l in open(path, errors="replace") if l.strip()]
                  if pattern:
                      matched = [l for l in all_lines if re.search(pattern, l, re.I)]
                      picked = matched[-20:] if matched else all_lines[-20:]
                  else:
                      picked = all_lines[-20:]
                  emit(title, picked)
                  summary.append(f"### {title} ({outcome})")
                  summary.append("```")
                  summary.extend(picked[:20])
                  summary.append("```")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
          PY
        env:
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          IPA_OUTCOME: ${{ steps.ipa.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}

      - name: Upload Unsigned IPA for iPhone Testing
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PaperTerritory-unsigned-ipa
          path: artifacts/PaperTerritory-unsigned.ipa
          retention-days: 14

      - name: Upload CI logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            artifacts/*.log
            artifacts/destinations.txt
            artifacts/TestResults.xcresult
          retention-days: 14

      - name: Enforce All CI Gates
        if: always()
        run: |
          if [ "${{ steps.gen.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.ipa.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.format.outcome }}" != "success" ]; then
            echo "One or more CI checks failed. See Summarize Errors step above."
            exit 1
          fi
