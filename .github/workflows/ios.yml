name: iOS CI

on:
  push:
    branches:
      - main
      - feature-paperio-ios
  pull_request:
    branches:
      - main
      - feature-paperio-ios
  workflow_dispatch:

jobs:
  build-test-lint:
    name: Build, Test & Unsigned IPA (iOS)
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift environment
        run: |
          xcodebuild -version
          swift --version
          mkdir -p artifacts
          {
            echo "=== Installed Xcodes ==="
            ls -d /Applications/Xcode*.app || true
            echo "=== Disk Space ==="
            df -h /
            echo "=== Initial Runtimes ==="
            xcrun simctl list runtimes || true
            echo "=== Initial Available Devices ==="
            xcrun simctl list devices available || true
          } > artifacts/sim-inventory.txt 2>&1
          cat artifacts/sim-inventory.txt

      - name: Install CI tools (XcodeGen, SwiftLint, SwiftFormat)
        run: |
          for tool in xcodegen swiftlint swiftformat; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          xcodegen --version
          swiftlint version
          swiftformat --version

      - name: Generate Xcode project via XcodeGen
        id: gen
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && xcodegen generate) 2>&1 | tee artifacts/xcodegen.log

      - name: Provision & Boot iOS Simulator
        id: sim
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - << 'PY' 2>&1 | tee artifacts/sim-select.log
          import json, os, re, subprocess, sys

          def run(cmd, check=True, stream=False):
              print(f"+ {' '.join(cmd)}", flush=True)
              if stream:
                  p = subprocess.run(cmd, text=True)
                  if check and p.returncode != 0:
                      raise RuntimeError(f"Command failed ({p.returncode}): {' '.join(cmd)}")
                  return ""
              p = subprocess.run(cmd, text=True, capture_output=True)
              if p.stdout:
                  print(p.stdout, flush=True)
              if p.stderr:
                  print(p.stderr, flush=True)
              if check and p.returncode != 0:
                  raise RuntimeError(f"Command failed ({p.returncode}): {' '.join(cmd)}")
              return p.stdout

          def find_showdest_sim():
              out = run([
                  "xcodebuild", "-project", "ios/PaperTerritory.xcodeproj",
                  "-scheme", "PaperTerritory", "-showdestinations"
              ], check=False)
              matches = []
              for line in out.splitlines():
                  if "platform:iOS Simulator" not in line or "placeholder" in line:
                      continue
                  m_id = re.search(r"id:([A-Fa-f0-9-]{36})", line)
                  m_os = re.search(r"OS:([0-9.]+)", line)
                  m_name = re.search(r"name:([^,}]+)", line)
                  if m_id and m_os and m_name:
                      matches.append((m_id.group(1), m_os.group(1), m_name.group(1).strip()))
              iphones = [m for m in matches if "iPhone" in m[2]]
              pool = iphones or matches
              if not pool:
                  return None
              pool.sort(key=lambda m: (tuple(int(x) for x in m[1].split(".")), m[2]), reverse=True)
              return pool[0]

          chosen = find_showdest_sim()
          if not chosen:
              rt_json = json.loads(run(["xcrun", "simctl", "list", "runtimes", "-j"]))
              ios_runtimes = [
                  r for r in rt_json.get("runtimes", [])
                  if r.get("isAvailable") and ("iOS" in r.get("name", "") or r.get("platform") == "iOS")
              ]
              if not ios_runtimes:
                  print("No available iOS runtime found; downloading iOS platform...", flush=True)
                  run(["xcodebuild", "-downloadPlatform", "iOS"], stream=True)
                  chosen = find_showdest_sim()

          if not chosen:
              rt_json = json.loads(run(["xcrun", "simctl", "list", "runtimes", "-j"]))
              ios_runtimes = [
                  r for r in rt_json.get("runtimes", [])
                  if r.get("isAvailable") and ("iOS" in r.get("name", "") or r.get("platform") == "iOS")
              ]
              if not ios_runtimes:
                  sys.exit("Still no available iOS runtime after downloadPlatform")
              ios_runtimes.sort(key=lambda r: tuple(int(x) for x in r.get("version", "0").split(".")), reverse=True)
              runtime_id = ios_runtimes[0]["identifier"]

              dt_json = json.loads(run(["xcrun", "simctl", "list", "devicetypes", "-j"]))
              iphone_types = [
                  d for d in dt_json.get("devicetypes", [])
                  if "iPhone" in d.get("name", "")
              ]
              if not iphone_types:
                  sys.exit("No iPhone device types found")
              preferred = [d for d in iphone_types if re.search(r"iPhone 1[567]", d.get("name", ""))]
              dev_type = (preferred[-1] if preferred else iphone_types[-1])["identifier"]

              udid = run(["xcrun", "simctl", "create", "CI iPhone", dev_type, runtime_id]).strip().splitlines()[-1].strip()
              chosen = (udid, ios_runtimes[0].get("version", "unknown"), "CI iPhone")

          udid = chosen[0]
          print(f"Chosen simulator: {chosen[2]} (iOS {chosen[1]}) -> {udid}", flush=True)
          run(["xcrun", "simctl", "boot", udid], check=False)
          run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=False)
          with open("artifacts/sim-inventory.txt", "a") as inv:
              inv.write("\n=== Post-Provision Runtimes ===\n")
              inv.write(run(["xcrun", "simctl", "list", "runtimes"], check=False))
              inv.write("\n=== Post-Provision Available Devices ===\n")
              inv.write(run(["xcrun", "simctl", "list", "devices", "available"], check=False))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"udid={udid}\n")
          PY

      - name: Build & Run Unit Tests (iOS Simulator)
        id: test
        if: steps.gen.outcome == 'success' && steps.sim.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf artifacts/TestResults.xcresult
          xcodebuild test \
            -project ios/PaperTerritory.xcodeproj \
            -scheme PaperTerritory \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/DerivedData \
            -resultBundlePath artifacts/TestResults.xcresult \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Build Unsigned Device IPA (Sideloadly / AltStore)
        id: ipa
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/PaperTerritory.xcodeproj \
            -scheme PaperTerritory \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedDataDevice \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild-device.log

          APP_PATH="ios/DerivedDataDevice/Build/Products/Release-iphoneos/PaperTerritory.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p artifacts/ipa_stage/Payload
            cp -R "$APP_PATH" artifacts/ipa_stage/Payload/
            (cd artifacts/ipa_stage && zip -qry ../PaperTerritory-unsigned.ipa Payload)
            rm -rf artifacts/ipa_stage
            ls -lh artifacts/PaperTerritory-unsigned.ipa
          else
            echo "PaperTerritory.app not found at $APP_PATH"
            exit 1
          fi

      - name: Run SwiftLint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && swiftlint lint --strict --config .swiftlint.yml) 2>&1 | tee artifacts/swiftlint.log

      - name: Check SwiftFormat
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          (cd ios && swiftformat --lint --config .swiftformat .) 2>&1 | tee artifacts/swiftformat.log

      - name: Summarize Full Errors & Emit Annotations
        if: always()
        run: |
          if [ -d artifacts/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path artifacts/TestResults.xcresult > artifacts/xcresult-summary.txt 2>&1 || true
          fi
          python3 - << 'PY'
          import collections, os, re

          annotations_emitted = 0

          def emit_annotation(title, msg):
              global annotations_emitted
              if annotations_emitted >= 45:
                  return
              clean = msg.replace("%", "%25").replace("\r", "").strip()
              print(f"::error title={title}::{clean[:240]}")
              annotations_emitted += 1

          summary = [
              "## iOS CI Results",
              f"- XcodeGen: {os.environ.get('GEN_OUTCOME')}",
              f"- Simulator Provision: {os.environ.get('SIM_OUTCOME')}",
              f"- Simulator Build & Test: {os.environ.get('TEST_OUTCOME')}",
              f"- Unsigned Device IPA: {os.environ.get('IPA_OUTCOME')}",
              f"- SwiftLint: {os.environ.get('LINT_OUTCOME')}",
              f"- SwiftFormat: {os.environ.get('FORMAT_OUTCOME')}",
              ""
          ]

          if os.path.exists("artifacts/xcresult-summary.txt"):
              summary.append("### Test Results Summary (`xcresulttool`)")
              summary.append("```")
              summary.append(open("artifacts/xcresult-summary.txt", errors="replace").read().strip())
              summary.append("```\n")

          if os.path.exists("artifacts/sim-inventory.txt"):
              summary.append("<details><summary>Simulator & Runtime Inventory</summary>\n\n```")
              summary.append(open("artifacts/sim-inventory.txt", errors="replace").read().strip())
              summary.append("```\n</details>\n")

          if os.path.exists("artifacts/swiftformat.log"):
              fmt_lines = [
                  l.rstrip() for l in open("artifacts/swiftformat.log", errors="replace")
                  if ".swift" in l or "error:" in l.lower()
              ]
              if fmt_lines or os.environ.get("FORMAT_OUTCOME") != "success":
                  summary.append(f"### SwiftFormat ({len(fmt_lines)} lines)")
                  summary.append("```")
                  summary.extend(fmt_lines or ["(see artifacts/swiftformat.log)"])
                  summary.append("```\n")
                  for l in fmt_lines:
                      emit_annotation("SwiftFormat", l)

          if os.path.exists("artifacts/swiftlint.log"):
              lint_lines = [
                  l.rstrip() for l in open("artifacts/swiftlint.log", errors="replace")
                  if re.search(r"(warning:|error:)", l)
              ]
              rule_counts = collections.Counter()
              for l in lint_lines:
                  m = re.search(r"\(([a-z0-9_]+)\)\s*$", l)
                  if m:
                      rule_counts[m.group(1)] += 1
              if lint_lines or os.environ.get("LINT_OUTCOME") != "success":
                  summary.append(f"### SwiftLint ({len(lint_lines)} findings)")
                  if rule_counts:
                      summary.append("Grouped by rule: " + ", ".join(f"`{k}`: {v}" for k, v in rule_counts.most_common()))
                  summary.append("```")
                  summary.extend(lint_lines or ["(see artifacts/swiftlint.log)"])
                  summary.append("```\n")
                  for l in lint_lines:
                      emit_annotation("SwiftLint", l)

          for title, outcome, path in [
              ("XcodeGen", os.environ.get("GEN_OUTCOME"), "artifacts/xcodegen.log"),
              ("Simulator", os.environ.get("SIM_OUTCOME"), "artifacts/sim-select.log"),
              ("XcodeTest", os.environ.get("TEST_OUTCOME"), "artifacts/xcodebuild.log"),
              ("DeviceIPA", os.environ.get("IPA_OUTCOME"), "artifacts/xcodebuild-device.log"),
          ]:
              if not os.path.exists(path):
                  continue
              all_lines = [l.rstrip() for l in open(path, errors="replace") if l.strip()]
              diag = [
                  l for l in all_lines
                  if re.search(r"(error:|fatal error:|warning:|Test Case .* failed|\*\* TEST FAILED \*\*|BUILD FAILED)", l)
              ]
              if outcome != "success" or diag:
                  picked = diag if diag else all_lines[-40:]
                  summary.append(f"### {title} ({outcome}, {len(picked)} diagnostic lines)")
                  summary.append("```")
                  summary.extend(picked)
                  summary.append("```\n")
                  if outcome != "success":
                      for l in picked:
                          emit_annotation(title, l)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
          PY
        env:
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          SIM_OUTCOME: ${{ steps.sim.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          IPA_OUTCOME: ${{ steps.ipa.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}

      - name: Upload Unsigned IPA for iPhone Testing
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PaperTerritory-unsigned-ipa
          path: artifacts/PaperTerritory-unsigned.ipa
          retention-days: 14

      - name: Upload CI logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/TestResults.xcresult
          retention-days: 14

      - name: Enforce All CI Gates
        if: always()
        run: |
          if [ "${{ steps.gen.outcome }}" != "success" ] || \
             [ "${{ steps.sim.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.ipa.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.format.outcome }}" != "success" ]; then
            echo "One or more CI checks failed. See Summarize Full Errors step above."
            exit 1
          fi
